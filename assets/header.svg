<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Gaurav Guha • Lead AI Product Manager. I ship code, not just specs.">
  <title>Gaurav Guha • Lead AI Product Manager. I ship code, not just specs.</title>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#818CF8"/><stop offset="0.33" stop-color="#A78BFA"/><stop offset="0.66" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="240 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07070E"/><stop offset="1" stop-color="#0C0E1C"/></linearGradient>
    <linearGradient id="gridLine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/></linearGradient>
    <radialGradient id="aurA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366F1" stop-opacity="0.6"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="aurB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="bloom" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="panelClip"><rect x="0" y="0" width="1280" height="440" rx="26"/></clipPath>
    <clipPath id="gridClip"><rect x="0" y="298" width="1280" height="142"/></clipPath>

    <style>
      .aurA{animation:driftA 18s ease-in-out infinite}
      .aurB{animation:driftB 22s ease-in-out infinite}
      .eyebrow{animation:rise 800ms 120ms cubic-bezier(.2,.7,.2,1) both}
      .name{animation:rise 950ms 200ms cubic-bezier(.2,.7,.2,1) both}
      .tag{animation:rise 800ms 420ms cubic-bezier(.2,.7,.2,1) both}
      .link{animation:rise 800ms 560ms cubic-bezier(.2,.7,.2,1) both}
      .uline{stroke-dasharray:462;stroke-dashoffset:462;animation:draw 1100ms 700ms cubic-bezier(.6,0,.2,1) forwards}
      .term{animation:rise 800ms 260ms cubic-bezier(.2,.7,.2,1) both}
      .grid{animation:gridPulse 8s ease-in-out infinite}
      .gmove{animation:gridMove 6s linear infinite}
      .st{animation:tw 4s ease-in-out infinite}
      .st2{animation:tw 5.5s .7s ease-in-out infinite}
      .st3{animation:tw 6.8s 1.5s ease-in-out infinite}
      .status{animation:pulse 2.4s ease-in-out infinite}
      .l1{animation:pop 420ms 700ms cubic-bezier(.2,.8,.2,1) both}
      .l2{animation:pop 420ms 1050ms cubic-bezier(.2,.8,.2,1) both}
      .l3{animation:pop 420ms 1500ms cubic-bezier(.2,.8,.2,1) both}
      .l4{animation:pop 420ms 1850ms cubic-bezier(.2,.8,.2,1) both}
      .l5{animation:pop 420ms 2300ms cubic-bezier(.2,.8,.2,1) both}
      .l6{animation:pop 420ms 2650ms cubic-bezier(.2,.8,.2,1) both}
      .l7{animation:pop 420ms 3100ms cubic-bezier(.2,.8,.2,1) both}
      .l8{animation:pop 420ms 3450ms cubic-bezier(.2,.8,.2,1) both}
      .curse{animation:blink 1.05s 3900ms step-end infinite; opacity:0}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
      @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(56px,-28px)}}
      @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-46px,30px)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes gridPulse{0%,100%{opacity:.5}50%{opacity:.8}}
      @keyframes gridMove{from{transform:translateY(0)}to{transform:translateY(24px)}}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
      @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){
        .aurA,.aurB,.eyebrow,.name,.tag,.link,.term,.grid,.gmove,.st,.st2,.st3,.status,.l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.curse{animation:none}
        .uline{stroke-dashoffset:0;animation:none}.curse{opacity:1}
      }
    </style>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect x="0" y="0" width="1280" height="440" fill="url(#sky)"/>

    <!-- aurora -->
    <g filter="url(#soft)">
      <g class="aurA"><circle cx="300" cy="150" r="240" fill="url(#aurA)"/></g>
      <g class="aurB"><circle cx="1050" cy="120" r="220" fill="url(#aurB)"/></g>
    </g>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="st"  cx="140" cy="70"  r="1.5"/><circle class="st2" cx="240" cy="120" r="1.2"/><circle class="st3" cx="360" cy="60"  r="1.6"/>
      <circle class="st2" cx="520" cy="96"  r="1.2"/><circle class="st"  cx="80"  cy="150" r="1.3"/><circle class="st3" cx="420" cy="150" r="1.1"/>
      <circle class="st"  cx="700" cy="70"  r="1.4"/><circle class="st2" cx="860" cy="120" r="1.2"/><circle class="st3" cx="980" cy="66"  r="1.5"/>
      <circle class="st"  cx="1140" cy="110" r="1.3"/><circle class="st2" cx="1220" cy="70" r="1.2"/><circle class="st3" cx="600" cy="130" r="1.1"/>
      <circle class="st"  cx="1060" cy="180" r="1.2"/><circle class="st2" cx="180" cy="230" r="1.1"/>
    </g>

    <!-- synthwave perspective grid -->
    <g clip-path="url(#gridClip)">
      <ellipse cx="470" cy="300" rx="260" ry="60" fill="url(#sun)"/>
      <g class="grid" stroke="url(#gridLine)" stroke-width="1.2">
        <line x1="470" y1="300" x2="-140" y2="440"/><line x1="470" y1="300" x2="10" y2="440"/><line x1="470" y1="300" x2="150" y2="440"/>
        <line x1="470" y1="300" x2="290" y2="440"/><line x1="470" y1="300" x2="420" y2="440"/><line x1="470" y1="300" x2="520" y2="440"/>
        <line x1="470" y1="300" x2="650" y2="440"/><line x1="470" y1="300" x2="800" y2="440"/><line x1="470" y1="300" x2="980" y2="440"/>
        <line x1="470" y1="300" x2="1180" y2="440"/><line x1="470" y1="300" x2="1420" y2="440"/>
        <g class="gmove" stroke="#22D3EE" stroke-opacity="0.4">
          <line x1="0" y1="306" x2="1280" y2="306"/><line x1="0" y1="316" x2="1280" y2="316"/><line x1="0" y1="330" x2="1280" y2="330"/>
          <line x1="0" y1="349" x2="1280" y2="349"/><line x1="0" y1="374" x2="1280" y2="374"/><line x1="0" y1="406" x2="1280" y2="406"/>
        </g>
      </g>
    </g>

    <!-- ===== LEFT: identity ===== -->
    <g>
      <circle cx="70" cy="120" r="5" fill="#3FB950"/>
      <circle cx="70" cy="120" r="5" fill="none" stroke="#3FB950" stroke-opacity="0.6">
        <animate attributeName="r" values="5;13" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="eyebrow" x="86" y="125" font-size="13.5" letter-spacing="2.5" fill="#8B93A7" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">available for hard problems</text>

    <text class="eyebrow" x="66" y="168" font-size="14" letter-spacing="3.5" font-weight="600" fill="#A5B4FC" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">LEAD AI PRODUCT MANAGER</text>

    <g class="name">
      <text x="64" y="252" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#flow)" filter="url(#bloom)" opacity="0.55" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Gaurav Guha</text>
      <text x="64" y="252" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#flow)" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Gaurav Guha</text>
    </g>
    <line class="uline" x1="68" y1="278" x2="530" y2="278" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/>

    <text class="tag" x="66" y="326" font-size="23" fill="#C7CBDA" font-family="'SF Mono','JetBrains Mono',Consolas,monospace"><tspan fill="#22D3EE">&gt;</tspan> I ship code, not just specs</text>
    <text class="link" x="66" y="366" font-size="15" fill="#8B93A7" font-family="'SF Mono','JetBrains Mono',Consolas,monospace"><tspan fill="#818CF8">↗</tspan> gauravguha.com   <tspan fill="#818CF8">·</tspan>   in/gauravguha</text>

    <!-- ===== RIGHT: self-playing terminal ===== -->
    <g class="term">
      <rect x="604" y="70" width="612" height="300" rx="14" fill="#22D3EE" opacity="0.12" filter="url(#termGlow)"/>
      <rect x="604" y="70" width="612" height="300" rx="14" fill="#0B0D16" stroke="#20263a" stroke-width="1.5"/>
      <rect x="604" y="70" width="612" height="40" rx="14" fill="#11141f"/>
      <rect x="604" y="96" width="612" height="14" fill="#11141f"/>
      <circle cx="628" cy="90" r="6" fill="#FF5F57"/><circle cx="648" cy="90" r="6" fill="#FEBC2E"/><circle cx="668" cy="90" r="6" fill="#28C840"/>
      <text x="910" y="95" text-anchor="middle" font-size="13" fill="#6b7280" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">gaurav — zsh — 80×24</text>

      <g font-size="16" font-family="'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace">
        <text class="l1" x="628" y="150"><tspan fill="#3FB950">gaurav@nh</tspan><tspan fill="#6b7280"> ~ % </tspan><tspan fill="#E6EDF3">whoami</tspan></text>
        <text class="l2" x="628" y="176"><tspan fill="#8B93A7">Gaurav Guha · </tspan><tspan fill="#A5B4FC">Lead AI Product Manager</tspan></text>
        <text class="l3" x="628" y="208"><tspan fill="#3FB950">gaurav@nh</tspan><tspan fill="#6b7280"> ~ % </tspan><tspan fill="#E6EDF3">cat manifesto.txt</tspan></text>
        <text class="l4" x="628" y="234"><tspan fill="#22D3EE">I ship code, not just specs.</tspan></text>
        <text class="l5" x="628" y="266"><tspan fill="#3FB950">gaurav@nh</tspan><tspan fill="#6b7280"> ~ % </tspan><tspan fill="#E6EDF3">ls ./work</tspan></text>
        <text class="l6" x="628" y="292"><tspan fill="#67E8F9">gluestack  rapidnative  thefrontkit  natural-heroes</tspan></text>
        <text class="l7" x="628" y="324"><tspan fill="#3FB950">gaurav@nh</tspan><tspan fill="#6b7280"> ~ % </tspan><tspan fill="#E6EDF3">./ship.sh --now</tspan></text>
        <text class="l8" x="628" y="350"><tspan fill="#8B93A7">deploying… </tspan><tspan fill="#3FB950">✓ live in production</tspan></text>
      </g>
      <rect class="curse" x="628" y="336" width="10" height="18" fill="#22D3EE"/>
    </g>

    <rect x="1" y="1" width="1278" height="438" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>
</svg>
